<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>โปรแกรมคำนวณและทดสอบน้ำหนักเปอร์เซ็นต์ (4 ช่วงคะแนน)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 950px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        h2 {
            text-align: center;
            color: #1a365d;
            margin-bottom: 8px;
        }
        p.subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
        }
        .input-panel {
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 25px;
        }
        .input-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }
        .input-box {
            display: flex;
            flex-direction: column;
        }
        .input-box label {
            font-weight: 600;
            margin-bottom: 6px;
            color: #334155;
            font-size: 14px;
        }
        .input-box input {
            padding: 10px;
            border: 2px solid #cbd5e1;
            border-radius: 6px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: #0f172a;
            transition: border-color 0.2s;
        }
        .input-box input:focus {
            border-color: #2563eb;
            outline: none;
        }
        .btn-calc {
            width: 100%;
            padding: 14px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        .btn-calc:hover {
            background-color: #1d4ed8;
        }
        .btn-calc:active {
            transform: scale(0.99);
        }
        .summary-card {
            padding: 18px;
            border-radius: 8px;
            margin-bottom: 25px;
            font-size: 15px;
            line-height: 1.6;
        }
        .summary-success {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            color: #166534;
        }
        .summary-warning {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #991b1b;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 14px;
        }
        th, td {
            border: 1px solid #e2e8f0;
            padding: 10px;
            text-align: center;
        }
        th {
            background-color: #1e293b;
            color: white;
            font-weight: 600;
            position: sticky;
            top: 0;
        }
        tr:nth-child(even) {
            background-color: #f8fafc;
        }
        .impossible-row {
            background-color: #fff1f2 !important;
            color: #e11d48;
        }
        .score-col {
            font-weight: bold;
            color: #0284c7;
            font-size: 16px;
        }
        .formula-col {
            text-align: left;
            font-family: monospace;
            color: #475569;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>คำนวณและสอบทานสูตร 4 น้ำหนัก (%)</h2>
    <p class="subtitle">กรอกเปอร์เซ็นต์น้ำหนัก 4 ตัวใดก็ได้ เพื่อเช็คว่าสร้างคะแนน 1-100 ได้ครบหรือไม่</p>
    
    <div class="input-panel">
        <div class="input-grid">
            <div class="input-box">
                <label>น้ำหนักช่อง 1 (%)</label>
                <input type="number" id="p1" value="35" min="0" max="100">
            </div>
            <div class="input-box">
                <label>น้ำหนักช่อง 2 (%)</label>
                <input type="number" id="p2" value="35" min="0" max="100">
            </div>
            <div class="input-box">
                <label>น้ำหนักช่อง 3 (%)</label>
                <input type="number" id="p3" value="25" min="0" max="100">
            </div>
            <div class="input-box">
                <label>น้ำหนักช่อง 4 (%)</label>
                <input type="number" id="p4" value="5" min="0" max="100">
            </div>
        </div>

        <button class="btn-calc" onclick="runCalculation()">⚡ คำนวณตารางคะแนนใหม่</button>
    </div>

    <!-- สรุปภาพรวม -->
    <div id="summaryCard" class="summary-card" style="display:none;"></div>

    <!-- ตารางผลลัพธ์ -->
    <table>
        <thead>
            <tr>
                <th style="width: 12%;">คะแนน</th>
                <th style="width: 10%;">ก1</th>
                <th style="width: 10%;">ก2</th>
                <th style="width: 10%;">ก3</th>
                <th style="width: 10%;">ก4</th>
                <th>วิธีคิดคำนวณตามสูตร</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <!-- จะสร้างแถวตารางด้วย JS -->
        </tbody>
    </table>
</div>

<script>
function runCalculation() {
    // ดึงค่าเปอร์เซ็นต์ที่ผู้ใช้กรอกเปลี่ยนได้อิสระ
    const p1 = parseFloat(document.getElementById('p1').value) || 0;
    const p2 = parseFloat(document.getElementById('p2').value) || 0;
    const p3 = parseFloat(document.getElementById('p3').value) || 0;
    const p4 = parseFloat(document.getElementById('p4').value) || 0;

    const totalP = p1 + p2 + p3 + p4;

    // คำนวณตัวคูณของแต่ละช่อง:  ก x (% / 100) x 20  =>  ก x (% * 0.2)
    const m1 = p1 * 0.2;
    const m2 = p2 * 0.2;
    const m3 = p3 * 0.2;
    const m4 = p4 * 0.2;

    // หาผลลัพธ์ที่เป็นไปได้ทั้งหมดจากการใส่เลข 1-5 ใน 4 ช่อง (5^4 = 625 กรณี)
    let possibleScores = {};

    for (let g1 = 1; g1 <= 5; g1++) {
        for (let g2 = 1; g2 <= 5; g2++) {
            for (let g3 = 1; g3 <= 5; g3++) {
                for (let g4 = 1; g4 <= 5; g4++) {
                    // คำนวณคะแนนรวมแล้วปัดเศษเป็นจำนวนเต็ม
                    let score = Math.round((g1 * m1) + (g2 * m2) + (g3 * m3) + (g4 * m4));
                    if (!possibleScores[score]) {
                        possibleScores[score] = [g1, g2, g3, g4];
                    }
                }
            }
        }
    }

    // แสดงตารางคะแนน 1 - 100
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = '';

    let successCount = 0;
    let missingScores = [];

    for (let target = 1; target <= 100; target++) {
        const row = document.createElement('tr');

        if (possibleScores[target]) {
            successCount++;
            const [g1, g2, g3, g4] = possibleScores[target];
            const c1 = Number((g1 * m1).toFixed(1));
            const c2 = Number((g2 * m2).toFixed(1));
            const c3 = Number((g3 * m3).toFixed(1));
            const c4 = Number((g4 * m4).toFixed(1));

            row.innerHTML = `
                <td class="score-col">${target}</td>
                <td><strong>${g1}</strong></td>
                <td><strong>${g2}</strong></td>
                <td><strong>${g3}</strong></td>
                <td><strong>${g4}</strong></td>
                <td class="formula-col">(${g1}×${m1.toFixed(1)}) + (${g2}×${m2.toFixed(1)}) + (${g3}×${m3.toFixed(1)}) + (${g4}×${m4.toFixed(1)}) = ${c1}+${c2}+${c3}+${c4} = <strong>${target}</strong></td>
            `;
        } else {
            missingScores.push(target);
            row.className = 'impossible-row';
            row.innerHTML = `
                <td class="score-col" style="color:#e11d48;">${target}</td>
                <td colspan="4">❌ ไม่พบชุดเลข 1-5 ที่ทำได้</td>
                <td style="font-style:italic;">สูตรสัดส่วนนี้ไม่รองรับคะแนน ${target}</td>
            `;
        }
        tbody.appendChild(row);
    }

    // สรุปการประมวลผล
    const summaryCard = document.getElementById('summaryCard');
    summaryCard.style.display = 'block';

    let warningText = totalP !== 100 ? `<br><span style="color:#e11d48; font-weight:bold;">⚠️ เตือน: เปอร์เซ็นต์รวมกันได้ ${totalP}% (ควรจะเท่ากับ 100%)</span>` : '';

    if (missingScores.length === 0) {
        summaryCard.className = 'summary-card summary-success';
        summaryCard.innerHTML = `
            <strong>🎉 สูตรนี้สมบูรณ์แบบ! (${p1}%, ${p2}%, ${p3}%, ${p4}%)</strong><br>
            • ตัวคูณแต่ละช่องคือ: <strong>${m1.toFixed(1)}, ${m2.toFixed(1)}, ${m3.toFixed(1)}, ${m4.toFixed(1)}</strong><br>
            • ทำคะแนนได้ครบทั้ง <strong>${successCount} คะแนน</strong> (ตั้งแต่ช่วง Min ถึง Max ไม่มีเลขตกหล่นเลย) ${warningText}
        `;
    } else {
        summaryCard.className = 'summary-card summary-warning';
        summaryCard.innerHTML = `
            <strong>⚠️ สูตรนี้ทำได้ไม่ครบทุกเลข (${p1}%, ${p2}%, ${p3}%, ${p4}%)</strong><br>
            • ตัวคูณแต่ละช่องคือ: <strong>${m1.toFixed(1)}, ${m2.toFixed(1)}, ${m3.toFixed(1)}, ${m4.toFixed(1)}</strong><br>
            • ทำได้: <strong>${successCount}</strong> จาก 100 คะแนน<br>
            • คะแนนที่ไม่สามารถทำได้ (${missingScores.length} ตัว): <strong>${missingScores.join(', ')}</strong> ${warningText}
        `;
    }
}

// เรียกให้ทำงานทันทีตอนเปิดหน้าเว็บ
window.onload = runCalculation;
</script>

</body>
</html>
